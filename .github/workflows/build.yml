name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            artifact: flagr-macos-arm64
            asset: dist/flagr-macos-arm64.zip
          - os: ubuntu-22.04
            artifact: flagr-linux-x86_64
            asset: dist/flagr-linux-x86_64
          - os: windows-latest
            artifact: flagr-windows-x86_64
            asset: dist/flagr-windows-x86_64.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        if: runner.os != 'Linux'
        with:
          python-version: "3.13"

      - name: Test
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            python3 -m unittest -q
          else
            python -m unittest -q
          fi

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: .\build.bat

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          python3 -c "import tkinter; print('tk', tkinter.TkVersion)"
          ./build.sh
          ditto -c -k --keepParent dist/flagr.app dist/flagr-macos-arm64.zip

      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-tk
          PYTHON=python3 ./build.sh

      - name: Name download
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            mv dist/flagr dist/flagr-linux-x86_64
          elif [ "$RUNNER_OS" = "Windows" ]; then
            mv dist/flagr.exe dist/flagr-windows-x86_64.exe
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: ${{ matrix.asset }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flagr-*
          merge-multiple: true
          path: release

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --verify-tag --generate-notes
